# Codex configuration for execution-only placement: Codex runs in the control
# plane (here a container on the host, standing in for atomic serve) and calls
# the model itself; commands run in the actor through exec-server.
model = "Qwen3.6-35B-A3B-MTP-GGUF-UD-Q4_K_XL"
model_provider = "lemonade"
approval_policy = "never"
# The actor is the boundary; nothing else of value lives in it.
default_permissions = ":danger-full-access"

[model_providers.lemonade]
name = "Lemonade"
base_url = "http://127.0.0.1:13305/v1"
wire_api = "responses"
env_key = "LEMONADE_KEY"
