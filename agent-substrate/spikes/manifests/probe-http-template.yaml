# The probe with /slow and /stream, for the router's request timeout.
metadata:
  atespace: spikes
  name: probe-http
workerSelector:
  matchLabels:
    workload: counter
containers:
  - name: probe-http
    image: localhost:5000/substrate-probe@sha256:3833d1768597883ec01abd8e1fac3038655550080ca6f4d8cce06226f990acd3
    wakeupProbe:
      httpGet:
        path: /readyz
        port: 80
resources:
  limits:
    cpuMillicores: 500
    memoryBytes: 268435456
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
  storageLocation: s3://ate-snapshots/spikes
