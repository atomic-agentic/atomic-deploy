# ActorTemplate (protojson ateapi.ActorTemplate), created with
# `kubectl ate create actor-template --preview -f`. Upstream's, with the image
# built by ../images/substrate-demo.Dockerfile and a per-template snapshot
# location in the bucket kagent install created.
metadata:
  atespace: ate-demo-counter
  name: counter
workerSelector:
  matchLabels:
    workload: counter
containers:
  - name: counter
    image: localhost:5000/substrate-demo-counter@sha256:308b51e29cc72b7289939cc4d497486ef45383efc933d85d72ed510c67a6bf93
    command:
      - /ko-app/counter
      - --extra-port=9090
      - --tcp-port=9091
    wakeupProbe:
      httpGet:
        path: /readyz
        port: 80
    volumeMounts:
      - name: data
        mountPath: /home/counter
resources:
  limits:
    cpuMillicores: 1000
    memoryBytes: 536870912
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
  storageLocation: s3://ate-snapshots/spikes
volumes:
  - name: data
    durableDir: {}
