# Egress for the Codex actor: only the model gateway, with the placeholder
# Authorization header replaced by an actor JWT for audience ai-gateway.
rules:
  - http:
      hostnames: ["ai-gateway.agentgateway-system.svc.cluster.local"]
      ports: {numbers: [80]}
      effects:
        replaceHeaders:
          - header: Authorization
            prefix: "Bearer "
            actorJwt:
              audiences: ["ai-gateway"]
              expirationSeconds: 900
