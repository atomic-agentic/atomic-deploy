# Spike 5: Codex rust-v0.169.0's own sandbox command in a gVisor actor, with every capability Substrate allows.
metadata:
  atespace: spikes
  name: codex-probe-caps
workerSelector:
  matchLabels:
    workload: counter
containers:
  - name: probe
    image: localhost:5000/substrate-codex-probe@sha256:69ede17e9174eded56f41c2187ea25b364862397e4e2672ba5d44884042803e4
    securityContext:
      capabilities:
        # Every capability Substrate's admission allows adding.
        add: [AUDIT_WRITE, CHOWN, DAC_OVERRIDE, FOWNER, FSETID, KILL, NET_BIND_SERVICE,
              SETFCAP, SETGID, SETPCAP, SETUID, SYS_CHROOT]
    wakeupProbe:
      httpGet:
        path: /readyz
        port: 80
resources:
  limits:
    cpuMillicores: 500
    memoryBytes: 536870912
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
  storageLocation: s3://ate-snapshots/spikes
