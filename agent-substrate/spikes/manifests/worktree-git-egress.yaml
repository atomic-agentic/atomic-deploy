# Egress policy for the wt-git actor (spikes 3 and 7):
# - git over HTTPS to github.com only, relayed without inspection, so no trust
#   bundle is needed in the actor;
# - the model gateway, with the actor's placeholder Authorization header
#   replaced by an actor JWT for audience ai-gateway.
# kubectl ate create egress-policy wt-git -a spikes -f worktree-git-egress.yaml
rules:
  - tlsPassthrough:
      hostnames: ["github.com"]
      ports: {numbers: [443]}
  - http:
      hostnames: ["ai-gateway.agentgateway-system.svc.cluster.local"]
      ports: {numbers: [80]}
      effects:
        replaceHeaders:
          - header: Authorization
            prefix: "Bearer "
            actorJwt:
              audiences: ["ai-gateway"]
              expirationSeconds: 900
