# Spike 6: the bridge as a kagent bring-your-own harness, and an agent that
# uses it. kagent requires the image pinned by digest. The EgressPolicy lets
# the bridge reach atomic serve (the stand-in in atomic-serve-stub.yaml) and
# has Substrate's egress gateway put an actor JWT in its Authorization header.
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: atomic-bridge-spike
  namespace: kagent
spec:
  byo: {}
  workload:
    image: localhost:5000/atomic-kagent-bridge-spike@sha256:23479570b4f07e89daa99b39ebdec55f8b553668a1b3677ba447535af8d7c1ae
    command: ["/bridge"]
  env:
    - name: ATOMIC_URL
      value: http://atomic-serve.atomic.svc.cluster.local
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
---
apiVersion: api.kagent.dev/v1alpha3
kind: EgressPolicy
metadata:
  name: atomic-serve
  namespace: kagent
spec:
  destinations:
    - origin: http://atomic-serve.atomic.svc.cluster.local
      authentication:
        header: Authorization
        prefix: "Bearer "
        actorJwt:
          audiences: [atomic-serve]
          expirationSeconds: 900
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: atomic-bridge-spike
  namespace: kagent
spec:
  template:
    inline:
      description: Starts an atomic workflow run and pauses at its gates (spike 6 stub)
      modelConfig:
        name: default-model-config
      systemPrompt: Unused by the bring-your-own bridge.
  harnessRef:
    name: atomic-bridge-spike
  egressPolicyRefs:
    - name: atomic-serve
