# The end-to-end Codex atom: Codex 0.169 with exec-server and git, in a gVisor
# actor with the capabilities Codex's sandbox needs (spike 5) and a durable
# /work for the task repository.
metadata:
  atespace: spikes
  name: codex-runner
workerSelector:
  matchLabels:
    workload: counter
containers:
  - name: runner
    image: localhost:5000/substrate-codex-runner@sha256:d858a968d02e614e395818dbc4821a5c16ea61146c69f65ad1e220bbe2f8578a
    securityContext:
      capabilities:
        add: [AUDIT_WRITE, CHOWN, DAC_OVERRIDE, FOWNER, FSETID, KILL, NET_BIND_SERVICE,
              SETFCAP, SETGID, SETPCAP, SETUID, SYS_CHROOT]
    wakeupProbe:
      httpGet:
        path: /readyz
        port: 80
    volumeMounts:
      - name: work
        mountPath: /work
resources:
  limits:
    cpuMillicores: 1000
    memoryBytes: 805306368
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_VOLUMES
  storageLocation: s3://ate-snapshots/spikes
volumes:
  - name: work
    durableDir: {}
