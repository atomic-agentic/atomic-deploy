# Spike 5: Codex rust-v0.169.0's own sandbox command in a gVisor actor, default capabilities.
metadata:
  atespace: spikes
  name: codex-probe
workerSelector:
  matchLabels:
    workload: counter
containers:
  - name: probe
    image: localhost:5000/substrate-codex-probe@sha256:69ede17e9174eded56f41c2187ea25b364862397e4e2672ba5d44884042803e4
    wakeupProbe:
      httpGet:
        path: /readyz
        port: 80
resources:
  limits:
    cpuMillicores: 500
    memoryBytes: 536870912
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
  storageLocation: s3://ate-snapshots/spikes
