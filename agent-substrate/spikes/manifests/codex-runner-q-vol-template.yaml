# The spike 12 runner at volumes fidelity (kagent's), to show the runner
# reporting a turn lost to a suspend that ignored quiescence.
metadata:
  atespace: spikes
  name: codex-runner-q-vol
workerSelector:
  matchLabels:
    workload: counter
containers:
  - name: runner
    image: localhost:5000/substrate-codex-runner@sha256:10e411a0dba31ce9ba3636a6f0226b0789a6bf550358c0b692c4844a77bf3557
    securityContext:
      capabilities:
        add: [AUDIT_WRITE, CHOWN, DAC_OVERRIDE, FOWNER, FSETID, KILL, NET_BIND_SERVICE,
              SETFCAP, SETGID, SETPCAP, SETUID, SYS_CHROOT]
    wakeupProbe:
      httpGet:
        path: /readyz
        port: 80
    volumeMounts:
      - name: work
        mountPath: /work
resources:
  limits:
    cpuMillicores: 1000
    memoryBytes: 805306368
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_VOLUMES
  storageLocation: s3://ate-snapshots/spikes
volumes:
  - name: work
    durableDir: {}
