# Spike 1, microVM: Substrate's counter demo on a microVM worker pool (Cloud
# Hypervisor with Kata's guest kernel and rootfs). One worker, for memory.
apiVersion: v1
kind: Namespace
metadata:
  name: ate-demo-counter-microvm
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: counter-microvm
  namespace: ate-demo-counter-microvm
  labels:
    workload: counter-microvm
spec:
  replicas: 1
  workerImage: ghcr.io/kagent-dev/substrate/ateworker-microvm:v1.0.0
  sandboxClasses:
    - name: microvm
      configRef:
        name: microvm
  template:
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 1Gi
