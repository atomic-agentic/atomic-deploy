# Spike 4: a client inside the cluster with atenet-client's pod certificate,
# for the router's HTTPS route (443 -> 8443), where agentgateway routes HTTP
# by the ate-target-actor header. The client script comes from a ConfigMap
# (kubectl create configmap ws-client --from-file=../tools/ws-client.py).
apiVersion: v1
kind: Pod
metadata:
  name: router-client
  namespace: ate-system
spec:
  serviceAccountName: atenet-client
  restartPolicy: Never
  containers:
    - name: client
      # python:3.13-slim-trixie
      image: python@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
      command: ["sleep", "3600"]
      volumeMounts:
        - {name: identity, mountPath: /run/identity, readOnly: true}
        - {name: servicedns-ca, mountPath: /run/servicedns-ca, readOnly: true}
        - {name: tools, mountPath: /tools, readOnly: true}
  volumes:
    - name: identity
      projected:
        sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
    - name: servicedns-ca
      projected:
        sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
    - name: tools
      configMap:
        name: ws-client
