# Clients the router accepts, by SPIFFE ID. kagent install allows only its
# controller. `kubectl ate proxy` presents atenet-client's certificate; until
# atomic serve exists it is the control plane's only way in (check.sh). The
# list replaces kagent's, so it repeats the controller.
atenetRouter:
  ingressAllowedSPIFFEIDs:
    - spiffe://cluster.local/ns/kagent/sa/kagent-controller
    - spiffe://cluster.local/ns/ate-system/sa/atenet-client
