              try: ip=socket.gethostbyname(host)
              except Exception as x: ip="dns: %s"%x
              for m in e.get(name,[]): out["%s %s"%(name,m)]=dict(call(svc,url,m),ip=ip)
            return out

  # --- Spike 1 on Fargate: the same probe as SandboxProbe, run once.
  Cluster:
    Type: AWS::ECS::Cluster
    Properties: { ClusterName: atomic-spikes }
  TaskLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /atomic-spikes/fargate, RetentionInDays: 1 }
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
  SandboxTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: atomic-spikes-sandbox
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ContainerDefinitions:
        - Name: probe
          Image: public.ecr.aws/docker/library/python@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
          Essential: true
          # The probe source is passed at run time (run.sh) as PROBE, the
          # same code as SandboxProbe.
          Command: [python, -c, "import os; exec(os.environ['PROBE'])"]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref TaskLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: probe
  TaskSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Fargate probe, egress only
      VpcId: !Ref Vpc
      SecurityGroupEgress: [{ IpProtocol: "-1", CidrIp: 0.0.0.0/0 }]

Outputs:
  SandboxProbe: { Value: !Ref SandboxProbe }
  EnvReuse: { Value: !Ref EnvReuse }
  OtlpProbe: { Value: !Ref OtlpProbe }
  BedrockNone: { Value: !Ref BedrockNone }
  BedrockScoped: { Value: !Ref BedrockScoped }
  BedrockOpen: { Value: !Ref BedrockOpen }
  Cluster: { Value: !Ref Cluster }
  SandboxTask: { Value: !Ref SandboxTask }
  PublicSubnet: { Value: !Ref PublicSubnet }
  TaskSg: { Value: !Ref TaskSg }
