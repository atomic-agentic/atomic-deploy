# Tempo, single process, local storage. Receives traces from the collector
# over OTLP and serves them to Grafana. For more than one replica, switch the
# storage backend to object storage and follow Tempo's distributed guide.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    compaction:
      block_retention: ${TEMPO_RETENTION:-168h}
    ingestion:
      # atomic writes one trace per step attempt, so a busy deployment holds
      # many short live traces at once.
      max_traces_per_user: 50000
