# OpenTelemetry Collector for atomic. Shared by every deployment in this
# repository: each one sets the endpoints through environment variables and
# may merge in an overlay with a second --config (see docker-compose/collector).
#
#   atomic --OTLP--> collector --> Prometheus  (metrics, Prometheus OTLP receiver)
#                              --> Tempo       (traces, OTLP gRPC)
#                              --> Loki        (logs, OTLP HTTP)
#
# Environment:
#   PROMETHEUS_OTLP_ENDPOINT   default http://prometheus:9090/api/v1/otlp
#   TEMPO_OTLP_ENDPOINT        default tempo:4317
#   LOKI_OTLP_ENDPOINT         default http://loki:3100/otlp
#   TRACE_SAMPLE_PERCENT       share of routine traces kept, default 100
#   TRACE_DECISION_WAIT        how long a trace is buffered before sampling, default 60s

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # A backstop, not the control. atomic keeps prompt, completion and tool
  # content out of telemetry unless a project turns capture on; if content
  # arrives anyway, it is dropped here before it reaches a general-purpose
  # backend. Route captured content to a dedicated agent-quality backend
  # through its own pipeline instead of removing these lines.
  attributes/drop-content:
    actions:
      - { key: gen_ai.input.messages, action: delete }
      - { key: gen_ai.output.messages, action: delete }
      - { key: gen_ai.system_instructions, action: delete }
      - { key: gen_ai.tool.call.arguments, action: delete }
      - { key: gen_ai.tool.call.result, action: delete }
      - { key: gen_ai.prompt, action: delete }
      - { key: gen_ai.completion, action: delete }

  # The same backstop for Codex's own events, which atomic's Codex threads
  # emit as log records: codex.tool_result always carries the tool's
  # arguments and output, and codex.user_prompt the prompt when prompt
  # logging is on. Also applied to span events, which the attributes
  # processor above does not reach.
  transform/drop-content:
    error_mode: ignore
    log_statements:
      - context: log
        conditions:
          - IsMatch(attributes["event.name"], "^codex\\.")
        statements:
          - delete_key(attributes, "prompt")
          - delete_key(attributes, "arguments")
          - delete_key(attributes, "output")
    trace_statements:
      - context: spanevent
        statements:
          - delete_key(attributes, "gen_ai.input.messages")
          - delete_key(attributes, "gen_ai.output.messages")
          - delete_key(attributes, "gen_ai.system_instructions")
          - delete_key(attributes, "gen_ai.tool.call.arguments")
          - delete_key(attributes, "gen_ai.tool.call.result")
          - delete_key(attributes, "gen_ai.prompt")
          - delete_key(attributes, "gen_ai.completion")
      - context: spanevent
        conditions:
          - IsMatch(attributes["event.name"], "^codex\\.")
        statements:
          - delete_key(attributes, "prompt")
          - delete_key(attributes, "arguments")
          - delete_key(attributes, "output")

  # Keep every trace that matters to an operator, sample the routine rest.
  # A trace is judged decision_wait after its first span arrives. A step's
  # root span, which carries its status, duration and atomic.* outcome
  # attributes, is exported only when the step ends, so the policies below
  # see it only for steps shorter than decision_wait. A longer step is
  # judged on its child spans: kept if one of them errored, otherwise
  # sampled as routine. At the default of 100% nothing is dropped.
  tail_sampling:
    decision_wait: ${env:TRACE_DECISION_WAIT:-60s}
    num_traces: 100000
    policies:
      - name: errors
        type: status_code
        status_code: { status_codes: [ERROR] }
      - name: slow-steps
        type: latency
        latency: { threshold_ms: 30000 }
      - name: gate-decisions
        type: string_attribute
        string_attribute:
          key: atomic.gate.decision
          values: [rejected, expired]
      - name: schema-repairs
        type: numeric_attribute
        numeric_attribute: { key: atomic.schema.repairs, min_value: 1, max_value: 1000000 }
      - name: recovered-runs
        type: boolean_attribute
        boolean_attribute: { key: atomic.replay, value: true }
      - name: routine
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:TRACE_SAMPLE_PERCENT:-100}

  batch:
    send_batch_size: 8192
    timeout: 5s

connectors:
  # Request, error and duration metrics computed from spans before sampling,
  # so they stay exact whatever share of traces is kept. Useful before atomic
  # exports its own metrics, and as a cross-check afterwards.
  spanmetrics:
    namespace: traces.span.metrics
    histogram:
      unit: s
      explicit:
        buckets: [50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s, 30s, 60s, 120s, 300s]
    dimensions:
      - name: atomic.workflow.name
      - name: atomic.step
      - name: gen_ai.operation.name
      - name: gen_ai.agent.name
      - name: gen_ai.request.model
      - name: gen_ai.tool.name
    exemplars:
      enabled: true
    metrics_flush_interval: 15s
    # Stop emitting a series that has seen no spans for this long, so a
    # retired workflow or model does not report forever.
    metrics_expiration: 1h

  # Splits the trace pipeline so span metrics see every span and sampling
  # only affects what is stored.
  forward/sample: {}

exporters:
  otlphttp/prometheus:
    endpoint: ${env:PROMETHEUS_OTLP_ENDPOINT:-http://prometheus:9090/api/v1/otlp}
    tls:
      insecure: true

  otlp/tempo:
    endpoint: ${env:TEMPO_OTLP_ENDPOINT:-tempo:4317}
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: ${env:LOKI_OTLP_ENDPOINT:-http://loki:3100/otlp}
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                # Stated explicitly: the dashboards use these names
                # (otelcol_receiver_accepted_spans, not ..._total).
                without_type_suffix: true
                without_units: true
                without_scope_info: true
  pipelines:
    traces/in:
      receivers: [otlp]
      processors: [memory_limiter, attributes/drop-content, transform/drop-content]
      exporters: [spanmetrics, forward/sample]
    traces/store:
      receivers: [forward/sample]
      processors: [tail_sampling, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/drop-content, transform/drop-content, batch]
      exporters: [otlphttp/loki]
