# Loki, single process, filesystem storage. Receives atomic's logs from the
# collector over OTLP (/otlp/v1/logs). For more than one replica, use object
# storage and Loki's simple scalable or microservices mode.

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2025-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: ${LOKI_RETENTION:-168h}
  allow_structured_metadata: true
  volume_enabled: true
  # Resource attributes that become stream labels. Everything else on a log
  # record (run IDs, step names, trace IDs) stays structured metadata, so a
  # run never becomes a stream of its own.
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes:
            - service.name
            - service.namespace
            - deployment.environment.name

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ingester:
  wal:
    # Loki stops accepting writes when the disk holding its WAL passes this
    # share full (0.9 by default). Logs then queue in the collector and are
    # retried; watch Export failures on the Telemetry pipeline dashboard.
    disk_full_threshold: ${LOKI_DISK_FULL_THRESHOLD:-0.9}

pattern_ingester:
  enabled: true

analytics:
  reporting_enabled: false
